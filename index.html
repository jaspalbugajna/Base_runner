<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Base Runner</title>
    <style>
        body { margin: 0; background: #0052ff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: white; overflow: hidden; }
        canvas { background: #111; border: 4px solid #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .ui { margin-bottom: 10px; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="ui">Base Tokens: <span id="score">0</span> | Lives: <span id="lives">3</span></div>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        let score = 0, lives = 3;
        let player = { x: 50, y: 250, w: 30, h: 40, dx: 0, dy: 0, speed: 5, jumpPower: -12, grounded: false };
        let gravity = 0.6, keys = {};
        let platforms = [{x: 0, y: 350, w: 800, h: 50}, {x: 300, y: 250, w: 150, h: 20}, {x: 550, y: 180, w: 180, h: 20}, {x: 100, y: 180, w: 120, h: 20}];
        let coins = [{x: 350, y: 210, r: 10, collected: false}, {x: 600, y: 140, r: 10, collected: false}, {x: 150, y: 140, r: 10, collected: false}];

        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function update() {
            if (keys['ArrowLeft'] || keys['KeyA']) player.dx = -player.speed;
            else if (keys['ArrowRight'] || keys['KeyD']) player.dx = player.speed;
            else player.dx = 0;

            if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && player.grounded) {
                player.dy = player.jumpPower;
                player.grounded = false;
            }

            player.dy += gravity;
            player.x += player.dx;
            player.y += player.dy;

            player.grounded = false;
            platforms.forEach(p => {
                if (player.x < p.x + p.w && player.x + player.w > p.x &&
                    player.y + player.h > p.y && player.y + player.h - player.dy <= p.y) {
                    player.y = p.y - player.h;
                    player.dy = 0;
                    player.grounded = true;
                }
            });

            if (player.x < 0) player.x = 0;
            if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;
            if (player.y > canvas.height) { lives--; document.getElementById('lives').innerText = lives; resetPlayer(); }

            coins.forEach(c => {
                if (!c.collected && Math.hypot((player.x + player.w/2) - c.x, (player.y + player.h/2) - c.y) < c.r + 15) {
                    c.collected = true; score += 10; document.getElementById('score').innerText = score;
                }
            });
        }

        function resetPlayer() { player.x = 50; player.y = 250; player.dy = 0; }

        function draw() {
            ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0052ff';
            platforms.forEach(p => { ctx.fillRect(p.x, p.y, p.w, p.h); ctx.strokeStyle = '#ffffff'; ctx.strokeRect(p.x, p.y, p.w, p.h); });
            coins.forEach(c => {
                if (!c.collected) {
                    ctx.fillStyle = '#00d2ff'; ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.stroke();
                }
            });
            ctx.fillStyle = '#ffffff'; ctx.fillRect(player.x, player.y, player.w, player.h);
        }

        function loop() {
            if (lives > 0) { update(); draw(); requestAnimationFrame(loop); }
            else { ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = 'white'; ctx.font = '30px Arial'; ctx.textAlign = 'center'; ctx.fillText('Game Over', canvas.width/2, canvas.height/2); }
        }
        loop();
    </script>
</body>
</html>
